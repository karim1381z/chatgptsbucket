name: Share Audio for Review

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-artifact@v4
        with:
          name: gemini-voice-A-act-directed-review
          path: |
            audition_A_act_directed.wav
            audition_A_act_directed_metadata.json
          if-no-files-found: error
          retention-days: 1
