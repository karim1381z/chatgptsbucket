name: Share Audio for Review

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-artifact@v4
        with:
          name: chatterbox-baseline-review
          path: |
            audition_chatterbox_beats4_5_baseline.wav
          if-no-files-found: error
          retention-days: 1
